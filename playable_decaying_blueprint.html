<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decaying Blueprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #0b345c; color: #e0f2fe; font-family: ui-monospace, monospace; }
        canvas { display: block; margin: 0 auto; border: 2px solid rgba(255,255,255,0.25); border-radius: 4px; }
        .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(11,52,92,0.92); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 gap-3">
    <a href="index.html" class="text-blue-300/80 text-sm hover:text-white">← All games</a>
    <p class="text-center text-sm text-blue-200/80">Study the blueprint for 8 seconds, then navigate blind to the green exit (arrow keys).</p>
    <div class="relative w-full max-w-4xl aspect-video">
        <canvas id="c"></canvas>
        <div id="win" class="overlay hidden rounded">
            <h2 class="text-3xl font-bold mb-2">BLUEPRINT EXECUTED</h2>
            <button id="again" class="px-5 py-2 bg-white text-blue-900 font-bold rounded">Next layout</button>
        </div>
        <div id="lose" class="overlay hidden rounded">
            <h2 class="text-3xl font-bold text-red-300 mb-2">LOST IN THE VOID</h2>
            <button id="retry" class="px-5 py-2 border-2 border-white font-bold rounded">Retry</button>
        </div>
    </div>
    <script>
        const CFG = { memorizeTime: 8, playerSpeed: 140, cols: 16, rows: 9 };

        // 0 floor, 1 wall, 2 start, 3 exit
        const LAYOUTS = [
            `1111111111111111
1200000000000003
1110111111111011
1000100000001011
1011111111101011
1000000000101011
1111111111101011
1000000000000011
1111111111111111`,
            `1111111111111111
1200011111000003
1011010001001111
1011010111000001
1000010101111101
1111010100000001
1000010111111101
1000000000000001
1111111111111111`
        ];

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let grid = [], layoutIndex = 0;
        let phase = 'memorize', phaseTimer = CFG.memorizeTime;
        let player = { x: 0, y: 0, r: 10 };
        let exit = { x: 0, y: 0 };
        let keys = { up: false, down: false, left: false, right: false };
        let lastTime = 0, gameState = 'play';

        function parseLayout(str) {
            const rows = str.trim().split('\n').map(l => l.trim());
            grid = rows.map(row => row.split('').map(ch => parseInt(ch, 10)));
            CFG.rows = grid.length;
            CFG.cols = grid[0].length;
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    const cell = grid[r][c];
                    const { w, h } = cellSize();
                    if (cell === 2) { player.x = (c + 0.5) * w; player.y = (r + 0.5) * h; }
                    if (cell === 3) { exit.x = (c + 0.5) * w; exit.y = (r + 0.5) * h; }
                }
            }
        }

        function cellSize() {
            return { w: canvas.width / CFG.cols, h: canvas.height / CFG.rows };
        }

        function resize() {
            const box = canvas.parentElement;
            canvas.width = box.clientWidth;
            canvas.height = box.clientHeight;
            parseLayout(LAYOUTS[layoutIndex % LAYOUTS.length]);
        }

        function loadLevel() {
            phase = 'memorize';
            phaseTimer = CFG.memorizeTime;
            gameState = 'play';
            document.getElementById('win').classList.add('hidden');
            document.getElementById('lose').classList.add('hidden');
            resize();
        }

        window.addEventListener('resize', () => { resize(); });
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = true;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        });

        function wallAt(px, py) {
            const { w, h } = cellSize();
            const c = Math.floor(px / w), r = Math.floor(py / h);
            if (r < 0 || r >= grid.length || c < 0 || c >= grid[0].length) return true;
            const t = grid[r][c];
            return t === 1;
        }

        function movePlayer(dt) {
            if (phase !== 'blind' || gameState !== 'play') return;
            let dx = 0, dy = 0;
            if (keys.up) dy -= 1;
            if (keys.down) dy += 1;
            if (keys.left) dx -= 1;
            if (keys.right) dx += 1;
            if (dx === 0 && dy === 0) return;
            const len = Math.hypot(dx, dy);
            dx = (dx / len) * CFG.playerSpeed * dt;
            dy = (dy / len) * CFG.playerSpeed * dt;
            const tryX = player.x + dx, tryY = player.y + dy;
            if (!wallAt(tryX, player.y)) player.x = tryX;
            if (!wallAt(player.x, tryY)) player.y = tryY;
            if (Math.hypot(player.x - exit.x, player.y - exit.y) < player.r + 12) {
                gameState = 'win';
                document.getElementById('win').classList.remove('hidden');
            }
        }

        function update(dt) {
            if (phase === 'memorize') {
                phaseTimer -= dt;
                if (phaseTimer <= 0) phase = 'blind';
            }
            movePlayer(dt);
        }

        function draw() {
            const { w, h } = cellSize();
            ctx.fillStyle = '#0b345c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    const t = grid[r][c];
                    const x = c * w, y = r * h;
                    if (t === 1) {
                        const alpha = phase === 'memorize' ? 0.95 : 0.08;
                        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                        ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
                    } else if (phase === 'memorize' && (t === 2 || t === 3)) {
                        ctx.fillStyle = t === 2 ? 'rgba(250,204,21,0.4)' : 'rgba(74,222,128,0.4)';
                        ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
                    }
                }
            }

            if (phase === 'memorize') {
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                for (let x = 0; x <= canvas.width; x += w) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y <= canvas.height; y += h) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
            } else {
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                for (let x = 0; x <= canvas.width; x += w) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y <= canvas.height; y += h) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
            }

            if (phase === 'blind') {
                ctx.fillStyle = '#facc15';
                ctx.beginPath(); ctx.arc(exit.x, exit.y, 10, 0, Math.PI * 2); ctx.fill();
            }

            ctx.fillStyle = '#38bdf8';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px monospace';
            if (phase === 'memorize') {
                ctx.fillText(`Memorize: ${phaseTimer.toFixed(1)}s`, 12, 24);
            } else {
                ctx.fillText('Blueprint faded — go!', 12, 24);
            }
        }

        function loop(ts) {
            if (!lastTime) lastTime = ts;
            const dt = Math.min((ts - lastTime) / 1000, 0.1);
            lastTime = ts;
            if (gameState === 'play') update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        document.getElementById('again').addEventListener('click', () => { layoutIndex++; loadLevel(); });
        document.getElementById('retry').addEventListener('click', loadLevel);
        loadLevel();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
